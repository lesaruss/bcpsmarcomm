<title>School Financial Reports - Broward County Public Schools</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* Same BCPS tokens as the District Software Inventory embed
       (public/embeds/software-inventory.html). No internal title: the
       Community Hub page section supplies its own heading. */
    --blue: #1672A7;
    --blue-dark: #0E4E73;
    --blue-faint: #EBF1F8;
    --border: #D0D7E2;
    --text: #1A1A2E;
    --text-mid: #444;
    --text-muted: #5F6672;
    --white: #FFFFFF;
    --bg: #F5F7FA;
    --radius: 8px;
    --font-body: "Open Sans", Arial, Helvetica, sans-serif;
  }

  body { font-family: var(--font-body); background: var(--white); color: var(--text); font-size: 14px; line-height: 1.5; }

  /* CONTROLS */
  .controls { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  input[type="search"] {
    width: 100%; padding: 8px 10px 8px 34px; border: 1px solid var(--border); border-radius: var(--radius);
    font-family: inherit; font-size: 13px; color: var(--text); background: var(--white); outline: none; -webkit-appearance: none;
  }
  input[type="search"]:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(22,114,167,0.15); }
  .chip-filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-right: 2px; }
  .chip-btn {
    padding: 4px 10px; min-height: 26px; border-radius: 20px; border: 1px solid var(--border); background: var(--white);
    font-family: inherit; font-size: 12px; font-weight: 500; color: var(--text-mid); cursor: pointer; white-space: nowrap;
  }
  .chip-btn:hover { border-color: var(--blue); color: var(--blue); }
  .chip-btn[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }

  /* RESULTS BAR */
  .results-bar {
    padding: 8px 20px; font-size: 12px; color: var(--text-muted); background: var(--bg); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .results-bar strong { color: var(--text); }
  .clear-btn { border: none; background: none; font-family: inherit; font-size: 12px; font-weight: 600; color: var(--blue); cursor: pointer; padding: 2px 0; }
  .clear-btn:hover { color: var(--blue-dark); text-decoration: underline; }
  .clear-btn[hidden] { display: none; }

  /* TABLE */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); background: var(--white); border-bottom: 2px solid var(--border); padding: 0;
  }
  th .th-static { display: block; padding: 10px 12px; }
  .sort-btn {
    display: inline-flex; align-items: center; gap: 5px; width: 100%; min-height: 40px; padding: 10px 12px;
    background: none; border: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; text-align: left;
  }
  .sort-btn:hover { color: var(--blue); }
  .sort-btn svg { flex-shrink: 0; opacity: 0.35; }
  th[aria-sort="ascending"] .sort-btn, th[aria-sort="descending"] .sort-btn { color: var(--blue-dark); }
  th[aria-sort="ascending"] .sort-btn svg, th[aria-sort="descending"] .sort-btn svg { opacity: 1; }
  th[aria-sort="descending"] .sort-btn svg { transform: rotate(180deg); }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:hover { background: var(--blue-faint); }
  td { padding: 10px 12px; vertical-align: middle; font-size: 13px; }
  td.loc { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text-mid); white-space: nowrap; width: 1%; }
  td.name { font-weight: 600; overflow-wrap: anywhere; }
  .school { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { width: 36px; height: 36px; flex-shrink: 0; border-radius: 6px; object-fit: contain; background: var(--white); }
  .logo-fallback {
    width: 36px; height: 36px; flex-shrink: 0; border-radius: 6px; background: var(--blue-faint); color: var(--blue-dark);
    display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
  }
  td.files { white-space: nowrap; width: 1%; }
  .files-wrap { display: flex; flex-wrap: nowrap; gap: 6px; justify-content: flex-end; }
  .sort-btn, th .th-static { white-space: nowrap; }
  .dl-btn {
    display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 5px 11px; border-radius: 6px;
    background: var(--white); border: 1px solid var(--blue); color: var(--blue); font-size: 12px; font-weight: 700; text-decoration: none;
  }
  .dl-btn:hover { background: var(--blue); color: #fff; }
  .dl-none { display: inline-flex; align-items: center; min-height: 32px; padding: 5px 11px; font-size: 12px; color: var(--text-muted); }
  .chip-btn:focus-visible, .clear-btn:focus-visible, .sort-btn:focus-visible, .dl-btn:focus-visible, .pg-btn:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 2px;
  }
  mark { background: #FFF3CD; color: inherit; border-radius: 2px; padding: 0 1px; }

  .empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13px; }
  .empty svg { display: block; margin: 0 auto 10px; opacity: 0.35; }

  /* PAGINATION */
  .pagination { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .pagination:empty { display: none; }
  .pg-btn {
    min-width: 32px; height: 32px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--white);
    color: var(--text-mid); font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .pg-btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
  .pg-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
  .pg-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .pg-ellipsis { color: var(--text-muted); font-size: 13px; padding: 0 4px; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  /* Phones: the table becomes a list. Sort buttons stay in a row on top;
     each school shows logo + location + name, with its year buttons underneath. */
  @media (max-width: 560px) {
    .controls, .results-bar { padding-left: 16px; padding-right: 16px; }
    table, thead, tbody, tr, td { display: block; width: 100%; }
    thead tr { display: flex; border-bottom: 2px solid var(--border); }
    thead th { border-bottom: none; }
    thead th.col-files { display: none; }
    tbody tr { display: grid; grid-template-columns: auto 1fr; align-items: center; padding: 10px 6px; }
    td { padding: 2px 8px; width: auto; }
    td.loc { width: auto; }
    td.files { grid-column: 1 / -1; width: auto; padding-top: 8px; }
    .files-wrap { justify-content: flex-start; flex-wrap: wrap; }
    tbody td[colspan] { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<div class="controls">
  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="search" id="searchInput" placeholder="Search by school name or location number..." aria-label="Search schools by name or location number">
  </div>
  <div class="chip-filters" id="yearChips" role="group" aria-label="Filter by school year"></div>
</div>

<div class="results-bar">
  <span role="status">Showing <strong id="resultCount">&hellip;</strong> of <span id="totalCount">&hellip;</span> schools</span>
  <button type="button" class="clear-btn" id="clearFilters" hidden>Clear filters</button>
</div>

<table>
  <caption class="sr-only">School Financial Reports by school and school year</caption>
  <thead>
    <tr>
      <th scope="col" data-sort="loc" aria-sort="ascending"><button type="button" class="sort-btn">Location # <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><polyline points="6 15 12 9 18 15"/></svg></button></th>
      <th scope="col" data-sort="name" aria-sort="none"><button type="button" class="sort-btn">School name <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><polyline points="6 15 12 9 18 15"/></svg></button></th>
      <th scope="col" class="col-files"><span class="th-static" style="text-align:right">School year report</span></th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<nav class="pagination" id="pagination" aria-label="Results pages"></nav>

<script>
// One row per school; each year's report is a download button. Data is the
// public anon read of bcps_school_financial_reports, so edits made in the
// Widgets hub editor show up here with no deploy.
const SUPABASE_URL = 'https://fwbhwfxpncrsfhttimna.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3Ymh3ZnhwbmNyc2ZodHRpbW5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NjAxMzksImV4cCI6MjA5MDIzNjEzOX0.9mxjK0bn5WATCbNLWrHPakD6yHUDtHFHrOaklPnWkOA';
// Seeded files live on bcpsmarcomm.com (/financial-reports/...). Resolve them
// against this page's own origin so the links work inside any iframe host.
const SITE = location.origin && location.origin !== 'null' ? location.origin : 'https://bcpsmarcomm.com';

let SCHOOLS = [];   // [{ loc, name, display, logo, reports: { '2023-2024': row, ... } }]
let YEARS = [];
let LOAD_FAILED = false;
let activeYear = '';
let activeSearch = '';
let sortKey = 'loc', sortDir = 1;
let currentPage = 1;
const PAGE_SIZE = 25;

function escapeHtml(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function highlight(text, q) {
  if (!q) return escapeHtml(text);
  const re = new RegExp('(' + escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return escapeHtml(text).replace(re, '<mark>$1</mark>');
}
function fileHref(u) {
  if (/^https:\/\//i.test(u || '')) return u;
  if (/^\/[^/]/.test(u || '')) return SITE + u;
  return '';
}
function yearLabel(y) { return y.replace(/^(\d{4})-\d{2}(\d{2})$/, '$1-$2'); }   // 2023-2024 -> 2023-24
function titleCase(s) {
  return String(s).toLowerCase().replace(/\b([a-z])/g, c => c.toUpperCase())
    .replace(/\b(Pk|Ucp|Arc|Pace|Ii|Iii)\b/g, m => m.toUpperCase()).replace(/'S\b/g, "'s");
}

function initials(name) {
  const skip = /^(of|the|and|at|school|elementary|middle|high|center|academy)$/i;
  const w = name.split(/[\s-]+/).filter(x => x && !skip.test(x));
  return (w.slice(0, 2).map(x => x[0]).join('') || name.slice(0, 2)).toUpperCase();
}
function logoHtml(s) {
  const fb = `<span class="logo-fallback" aria-hidden="true">${escapeHtml(initials(s.display))}</span>`;
  if (!/^https:\/\//.test(s.logo || '')) return fb;
  // alt="": the school name sits right beside the logo, so the image is decorative.
  return `<img class="logo" src="${escapeHtml(s.logo)}" alt="" loading="lazy" onerror="this.outerHTML=this.dataset.fb" data-fb="${escapeHtml(fb)}">`;
}

function getFiltered() {
  const q = activeSearch.toLowerCase().trim();
  const list = SCHOOLS.filter(s => {
    if (activeYear && !s.reports[activeYear]) return false;
    return !q || s.loc.includes(q) || s.name.toLowerCase().includes(q) || s.display.toLowerCase().includes(q);
  });
  return list.sort((a, b) => sortDir * (sortKey === 'name' ? a.display.localeCompare(b.display) : a.loc.localeCompare(b.loc)));
}

function renderYearChips() {
  const wrap = document.getElementById('yearChips');
  wrap.innerHTML = '<span class="chip-label" aria-hidden="true">School year:</span>' +
    [['', 'All years'], ...YEARS.map(y => [y, yearLabel(y)])].map(([k, label]) =>
      `<button type="button" class="chip-btn" data-year="${k}" aria-pressed="${k === activeYear}">${label}</button>`).join('');
  wrap.querySelectorAll('[data-year]').forEach(b => b.addEventListener('click', () => { setYear(b.dataset.year); currentPage = 1; render(); }));
}
function setYear(v) {
  activeYear = v;
  document.querySelectorAll('[data-year]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.year === v)));
}

function rowHtml(s, q) {
  const years = activeYear ? [activeYear] : YEARS;
  const btns = years.map(y => {
    const r = s.reports[y], href = r && fileHref(r.file_url);
    if (!href) return `<span class="dl-none">${yearLabel(y)}: not available</span>`;
    return `<a class="dl-btn" href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer" download="${escapeHtml(r.file_name || '')}"
      aria-label="${escapeHtml(yearLabel(y))} School Financial Report for ${escapeHtml(s.display)} (PDF, opens in a new tab)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      ${yearLabel(y)}</a>`;
  }).join('');
  return `<tr><td class="loc">${highlight(s.loc, q)}</td><td class="name"><div class="school">${logoHtml(s)}<span>${highlight(s.display, q)}</span></div></td><td class="files"><div class="files-wrap">${btns}</div></td></tr>`;
}

function renderPagination(total) {
  const totalPages = Math.ceil(total / PAGE_SIZE);
  const pg = document.getElementById('pagination');
  if (totalPages <= 1) { pg.innerHTML = ''; return; }
  const pages = [];
  if (totalPages <= 7) { for (let i = 1; i <= totalPages; i++) pages.push(i); }
  else {
    pages.push(1);
    if (currentPage > 3) pages.push('...');
    for (let i = Math.max(2, currentPage - 1); i <= Math.min(totalPages - 1, currentPage + 1); i++) pages.push(i);
    if (currentPage < totalPages - 2) pages.push('...');
    pages.push(totalPages);
  }
  pg.innerHTML = `
    <button type="button" class="pg-btn" id="pg-prev" aria-label="Previous page" ${currentPage === 1 ? 'disabled' : ''}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
    ${pages.map(p => p === '...' ? `<span class="pg-ellipsis" aria-hidden="true">...</span>`
      : `<button type="button" class="pg-btn${p === currentPage ? ' active' : ''}" data-page="${p}" aria-label="Page ${p}"${p === currentPage ? ' aria-current="page"' : ''}>${p}</button>`).join('')}
    <button type="button" class="pg-btn" id="pg-next" aria-label="Next page" ${currentPage === totalPages ? 'disabled' : ''}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button>`;
  pg.querySelector('#pg-prev')?.addEventListener('click', () => goToPage(currentPage - 1));
  pg.querySelector('#pg-next')?.addEventListener('click', () => goToPage(currentPage + 1));
  pg.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => goToPage(Number(b.dataset.page))));
}
function goToPage(p) { currentPage = p; render(); document.querySelector('table').scrollIntoView({ behavior: 'smooth', block: 'start' }); }

// Auto height: same bcps-widget-resize contract as the other embeds.
let lastPostedHeight = 0;
function postHeight() {
  const height = Math.ceil(document.body.getBoundingClientRect().height);
  if (Math.abs(height - lastPostedHeight) < 2) return;
  lastPostedHeight = height;
  window.parent.postMessage({ type: 'bcps-widget-resize', slug: 'school-financial-reports', height }, '*');
}

function render() {
  const q = activeSearch.trim();
  const filtered = getFiltered();
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  if (currentPage > totalPages) currentPage = 1;
  document.getElementById('resultCount').textContent = filtered.length;
  document.getElementById('clearFilters').hidden = !(activeYear || q);
  document.querySelectorAll('th[data-sort]').forEach(th =>
    th.setAttribute('aria-sort', th.dataset.sort === sortKey ? (sortDir === 1 ? 'ascending' : 'descending') : 'none'));
  const body = document.getElementById('rows');
  if (!filtered.length) {
    body.innerHTML = `<tr><td colspan="3"><div class="empty"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      ${LOAD_FAILED ? 'The reports could not be loaded right now. Please refresh the page to try again.' : 'No schools match your search. Try a different name or location number.'}</div></td></tr>`;
    renderPagination(0); postHeight(); return;
  }
  const start = (currentPage - 1) * PAGE_SIZE;
  body.innerHTML = filtered.slice(start, start + PAGE_SIZE).map(s => rowHtml(s, q)).join('');
  renderPagination(filtered.length);
  postHeight();
}

document.getElementById('searchInput').addEventListener('input', e => { activeSearch = e.target.value; currentPage = 1; render(); });
document.querySelectorAll('th[data-sort] .sort-btn').forEach(btn => btn.addEventListener('click', () => {
  const k = btn.parentElement.dataset.sort;
  if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
  currentPage = 1; render();
}));
document.getElementById('clearFilters').addEventListener('click', () => {
  activeSearch = ''; document.getElementById('searchInput').value = ''; setYear(''); currentPage = 1; render();
});

async function init() {
  const params = new URLSearchParams(location.search);
  try {
    // Traditional district schools only (Vanessa, 2026-11-16): contracted
    // sites and programs carry is_traditional = false and stay in the table.
    const headers = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY };
    const [res, logoRes] = await Promise.all([
      fetch(SUPABASE_URL + '/rest/v1/bcps_school_financial_reports?select=id,location_number,school_name,school_year,file_url,file_name&is_traditional=eq.true&order=location_number.asc', { headers }),
      fetch(SUPABASE_URL + '/rest/v1/bcps_school_logos?select=loc_no,logo_url&logo_url=not.is.null', { headers }).catch(() => null),
    ]);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    if (!Array.isArray(rows)) throw new Error('Unexpected response');
    const logos = {};
    try { if (logoRes && logoRes.ok) (await logoRes.json()).forEach(l => { logos[l.loc_no] = l.logo_url; }); } catch (e) { /* logos are optional */ }
    const by = new Map();
    rows.forEach(r => {
      if (!by.has(r.location_number)) by.set(r.location_number, { loc: r.location_number, name: r.school_name, display: titleCase(r.school_name), logo: logos[r.location_number], reports: {} });
      by.get(r.location_number).reports[r.school_year] = r;
    });
    SCHOOLS = [...by.values()];
    YEARS = [...new Set(rows.map(r => r.school_year))].sort();
  } catch (e) { SCHOOLS = []; LOAD_FAILED = true; }
  document.getElementById('totalCount').textContent = SCHOOLS.length;
  // ?year=2024-2025 or ?q=0011 pre-filter, so a school page can link straight to its own row.
  const y = params.get('year'), q = params.get('q');
  if (y && YEARS.includes(y)) activeYear = y;
  if (q) { activeSearch = q; document.getElementById('searchInput').value = q; }
  renderYearChips();
  render();
}

window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
else setInterval(postHeight, 500);

init();
</script>
</body>
</html>
