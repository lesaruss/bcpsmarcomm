<title>Department &amp; Program Directory - Broward County Public Schools</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Layout: one search bar over filter rows, then results grouped by topic
     (or A-Z, or best match while searching) in a two-column card grid.
     Same BCPS tokens as the Charter School and II&DL embeds: BCPS Blue for
     interaction, teal for Programs, Open Sans (the browardschools.com font), and
     no internal page title, since the destination page supplies its own.
     <html data-theme="light"> pins light mode on browardschools.com; the dark
     tokens only apply where the widget is previewed outside the site. */
  :root {
    --blue: #1672A7;
    --blue-dark: #0E4E73;
    --blue-faint: #EBF1F8;
    --teal: #00838F;
    --teal-dark: #006A74;
    --teal-faint: #E0F4F5;
    --mark: #FFF1B8;
    --on-blue: #FFFFFF;
    --border: #D0D7E2;
    --text: #1A1A2E;
    --text-mid: #444B57;
    --text-muted: #5F6672;
    --surface: #FFFFFF;
    --bg: #F5F7FA;
    --radius: 8px;
    --font-head: "Open Sans", Arial, Helvetica, sans-serif;
    --font-body: "Open Sans", Arial, Helvetica, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --blue: #6CB4E0; --blue-dark: #9FD0EE; --blue-faint: #16293A;
      --teal: #4FC3CC; --teal-dark: #84DCE2; --teal-faint: #12302F;
      --mark: #5A4A10; --on-blue: #0E141B; --border: #2E3A48; --text: #E8ECF2; --text-mid: #C3CAD4;
      --text-muted: #98A2AF; --surface: #151C25; --bg: #0E141B; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --blue: #6CB4E0; --blue-dark: #9FD0EE; --blue-faint: #16293A;
    --teal: #4FC3CC; --teal-dark: #84DCE2; --teal-faint: #12302F;
    --mark: #5A4A10; --on-blue: #0E141B; --border: #2E3A48; --text: #E8ECF2; --text-mid: #C3CAD4;
    --text-muted: #98A2AF; --surface: #151C25; --bg: #0E141B; color-scheme: dark;
  }

  body {
    font-family: var(--font-body);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* CONTROLS */
  .controls {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .search-wrap { position: relative; }
  .search-wrap svg.lens {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); pointer-events: none;
  }
  #q {
    width: 100%;
    padding: 13px 44px 13px 44px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: var(--surface);
    outline: none;
    -webkit-appearance: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #q::placeholder { color: var(--text-muted); }
  #q:focus { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 22%, transparent); }
  #q::-webkit-search-cancel-button { display: none; }
  #q.has-mic { padding-right: 84px; }
  .search-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border: 0; border-radius: 50%;
    background: transparent; color: var(--text-muted); cursor: pointer;
    display: grid; place-items: center;
  }
  .search-btn:hover { background: var(--bg); color: var(--text); }
  #mic { right: 6px; }
  #mic[aria-pressed="true"] { background: var(--blue); color: var(--on-blue); animation: listen 1.4s ease-in-out infinite; }
  @keyframes listen { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--blue) 25%, transparent); } }
  #q.has-mic ~ #clear { right: 44px; }
  .voice-msg { font-size: 12.5px; color: var(--text-mid); min-height: 0; }
  .voice-msg:empty { display: none; }

  /* "Can't find it?" (Sean and Vanessa, 2026-10-02) */
  .cant { border: 0; background: none; color: var(--blue); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: underline; padding: 4px 0; }
  .cant-panel {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 20px 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .cant-panel label { font-family: var(--font-head); font-weight: 700; font-size: 14px; color: var(--text); }
  .cant-panel textarea {
    width: 100%; min-height: 70px; resize: vertical; padding: 10px 12px;
    border: 1.5px solid var(--border); border-radius: var(--radius);
    font: inherit; font-size: 14px; color: var(--text); background: var(--surface);
  }
  .cant-panel textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 22%, transparent); }
  .cant-help { font-size: 12px; color: var(--text-muted); }
  .cant-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn-primary {
    border: 1px solid var(--blue); background: var(--blue); color: var(--on-blue);
    font: inherit; font-size: 13px; font-weight: 700; padding: 8px 16px; min-height: 38px;
    border-radius: var(--radius); cursor: pointer;
  }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .btn-plain {
    border: 1px solid var(--border); background: var(--surface); color: var(--text-mid);
    font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; min-height: 38px;
    border-radius: var(--radius); cursor: pointer;
  }

<script>
// Ordered by demand: the topics holding the most-visited pages come first.
const TOPICS = {
  enroll:     'Enrollment & School Choice',
  hr:         'Employees & Careers',
  ops:        'Buses, Meals & Facilities',
  support:    'Student Support & Health',
  acad:       'Academics & Learning',
  family:     'Families & Community',
  safety:     'Safety & Emergencies',
  activities: 'Arts, Athletics & Activities',
  money:      'Finance & Business',
  tech:       'Technology',
  gov:        'News, Board & Governance',
};

// Audience codes on each entry (F family, S student, E employee, C community or
// business). There is no audience picker in the UI, per NN/g's research on
// audience-based navigation; a host page can still preset one with ?aud=E.
const AUDIENCES = { F: 'Parent or family', S: 'Student', E: 'Employee', C: 'Community or business' };

// Content lives in bcps_directory_entries (public read of active rows, same
// model as the II&DL and Charter School embeds) and is edited in the portal
// at bcpsmarcomm.com, Widgets > Department & Program Directory. demand_rank
// orders cards inside a topic (GA4, most-wanted first); popular_label and
// popular_rank place an entry in the Most visited row.
const SUPABASE_URL = 'https://fwbhwfxpncrsfhttimna.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3Ymh3ZnhwbmNyc2ZodHRpbW5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NjAxMzksImV4cCI6MjA5MDIzNjEzOX0.9mxjK0bn5WATCbNLWrHPakD6yHUDtHFHrOaklPnWkOA';
const COLUMNS = 'id,kind,name,url,context,description,topic,audiences,tags,includes,demand_rank,popular_label,popular_rank,sort_order';

async function loadEntries() {
  // A static snapshot (window.DIRECTORY_DATA) is used where the page cannot
  // reach the database, such as an offline preview.
  if (Array.isArray(window.DIRECTORY_DATA)) return window.DIRECTORY_DATA;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/bcps_directory_entries?select=${COLUMNS}&active=eq.true&order=sort_order`, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY },
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

let ITEMS = [];
let POPULAR = [];
const rank = it => it.rank;
const popularLinks = () => POPULAR.map(it =>
  `<a class="chip try" href="${escapeHtml(it.url)}" target="_top" data-id="${it.id}" data-popular="1">${escapeHtml(it.popularLabel)}</a>`).join('');

const STOP = new Set(['a', 'an', 'and', 'the', 'my', 'for', 'of', 'to', 'in', 'on', 'how', 'do', 'i', 'is', 'where', 'what', 'can', 'get', 'find', 'about', 'with', 'me', 'bcps']);

function norm(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/&/g, ' and ').replace(/['’]/g, '').replace(/[^a-z0-9+]+/g, ' ').trim();
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function buildItems(rows) {
  ITEMS = rows.map(r => ({
    id: r.id,
    type: r.kind === 'department' ? 'dept' : 'prog',
    name: r.name,
    url: r.url,
    where: r.kind === 'department' ? (r.context || '') : (r.context ? 'Part of ' + r.context : ''),
    desc: r.description || '',
    topic: TOPICS[r.topic] ? r.topic : 'gov',
    aud: r.audiences || '',
    tags: r.tags || [],
    includes: r.includes || [],
    rank: r.demand_rank == null ? Infinity : r.demand_rank,
    popularLabel: r.popular_label,
    popularRank: r.popular_rank,
  }));
  POPULAR = ITEMS.filter(it => it.popularLabel).sort((a, b) => (a.popularRank ?? 99) - (b.popularRank ?? 99));

  // Each searchable field carries a weight: a hit in the name outranks a tag,
  // which outranks the description. Tags are kept one per field so a card can
  // say exactly which tag matched.
  for (const it of ITEMS) {
    it.fields = [
      { w: 10, kind: 'name', text: norm(it.name) },
      ...it.includes.map(s => ({ w: 7, kind: 'includes', raw: s, text: norm(s) })),
      ...it.tags.map(s => ({ w: 6, kind: 'tag', raw: s, text: norm(s) })),
      { w: 3, kind: 'where', text: norm(it.where) },
      { w: 2, kind: 'desc', text: norm(it.desc) },
    ];
    for (const f of it.fields) f.words = f.text.split(' ');
    it.nname = norm(it.name);
  }
}

// Strict: whole words (and simple plurals), plus prefixes once a word is 4+
// letters, so "bus" finds buses but not business. Loose adds prefixes for
// short words too and is only used when strict finds nothing (mid-typing).
function tokenMatches(field, tok, loose) {
  const prefixOk = loose || tok.length >= 4;
  if (field.words.some(w => w === tok || w === tok + 's' || w === tok + 'es' || (prefixOk && w.startsWith(tok)))) return true;
  return tok.length >= 5 && field.text.includes(tok);
}
// Optimal string alignment distance, capped: enough to catch "transportaion",
// "counsler" or "hurricaine" without matching unrelated words.
function editDistance(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    let rowMin = Infinity;
    for (let j = 1; j <= b.length; j++) {
      const c = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      rowMin = Math.min(rowMin, d[i][j]);
    }
    if (rowMin > max) return max + 1;
  }
  return d[a.length][b.length];
}
function fuzzyMatches(field, tok) {
  if (tok.length < 5 || field.kind === 'desc' || field.kind === 'where') return false;
  const max = tok.length >= 8 ? 2 : 1;
  return field.words.some(w => w.length >= 4 && editDistance(tok, w, max) <= max);
}
function variants(tok) {
  const v = [tok];
  if (tok.length > 3 && tok.endsWith('es')) v.push(tok.slice(0, -2));
  if (tok.length > 3 && tok.endsWith('s')) v.push(tok.slice(0, -1));
  return v;
}

// Returns { score, why, hits } or null. mode 'all' requires every word to
// match somewhere; 'any' is the fallback when nothing matches every word.
function scoreItem(it, tokens, phrase, mode, loose, fuzzy) {
  let score = 0, hits = 0, why = null;
  for (const tok of tokens) {
    let best = null;
    for (const f of it.fields) {
      if (best && f.w <= best.w) continue;
      if (variants(tok).some(t => tokenMatches(f, t, loose)) || (fuzzy && fuzzyMatches(f, tok))) best = f;
    }
    if (!best) { if (mode === 'all') return null; continue; }
    hits++; score += best.w;
    if (!why && (best.kind === 'tag' || best.kind === 'includes')) why = best;
  }
  if (!hits) return null;
  if (it.nname === phrase) score += 30;
  else if (it.nname.startsWith(phrase)) score += 15;
  else if (it.nname.includes(phrase)) score += 8;
  const exactTag = it.fields.find(f => (f.kind === 'tag' || f.kind === 'includes') && f.text === phrase);
  if (exactTag) { score += 8; why = exactTag; }
  if (it.nname.includes(phrase)) why = null;
  return { score, why, hits };
}

function highlight(name, tokens) {
  let html = escapeHtml(name);
  const toks = tokens.filter(t => t.length >= 2).sort((a, b) => b.length - a.length);
  if (!toks.length) return html;
  const re = new RegExp('\\b(' + toks.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  return html.replace(/(<[^>]*>)|([^<]+)/g, (m, tag, text) => tag ? tag : text.replace(re, '<mark>$1</mark>'));
}

// STATE
// A to Z is the default view (Sean, 2026-10-02): it matches the current
// Programs & Services directory, so the change is a transition, not a jump.
// Group by topic stays one click away in the sort menu.
// The A to Z view shows one letter at a time, starting at A, rather than one
// long scroll (Sean, 2026-10-02). state.letter is that letter.
const state = { q: '', type: 'all', aud: '', topic: '', sort: 'az', letter: 'A' };
const PREVIEW = 6;
const opened = new Set();

const $ = id => document.getElementById(id);
const qEl = $('q'), out = $('out');

// Controls
const topicSel = $('topic');
for (const [k, v] of Object.entries(TOPICS)) topicSel.insertAdjacentHTML('beforeend', `<option value="${k}">${escapeHtml(v)}</option>`);

function compute() {
  const phrase = norm(state.q);
  const tokens = phrase.split(' ').filter(t => t && !STOP.has(t));
  const searching = tokens.length > 0;

  const pass = it => (!state.aud || it.aud.includes(state.aud)) && (!state.topic || it.topic === state.topic);
  const base = ITEMS.filter(pass);
  let pool = base.map(it => ({ it, s: { score: 0 } }));
  let partial = false;
  if (searching) {
    // Widen step by step until something matches: every word strictly, every
    // word loosely, then (for multi-word searches) some of the words.
    // Last resort: tolerate a typo or two in longer words.
    const steps = [['all', false, false], ['all', true, false]];
    if (tokens.length > 1) steps.push(['any', false, false], ['any', true, false]);
    steps.push(['all', true, true]);
    if (tokens.length > 1) steps.push(['any', true, true]);
    pool = [];
    for (const [mode, loose, fuzzy] of steps) {
      pool = base.map(it => ({ it, s: scoreItem(it, tokens, phrase, mode, loose, fuzzy) })).filter(r => r.s);
      if (pool.length) { partial = fuzzy ? 'fuzzy' : mode === 'any'; break; }
    }
  }
  const counts = { all: pool.length, dept: pool.filter(r => r.it.type === 'dept').length, prog: pool.filter(r => r.it.type === 'prog').length };
  const rows = state.type === 'all' ? pool : pool.filter(r => r.it.type === state.type);
  return { rows, counts, tokens, searching, partial };
}

function card({ it, s }, tokens) {
  const why = s && s.why
    ? `<span class="why">Matches “${escapeHtml(s.why.raw)}”</span>` : '';
  const incl = it.includes.length
    ? `<span class="incl"><b>Includes:</b> ${it.includes.map(n => highlight(n, tokens)).join(', ')}</span>` : '';
  const label = it.type === 'dept' ? 'Department' : 'Program';
  return `<a class="card" href="${escapeHtml(it.url)}" target="_top" data-id="${it.id}">
    <span class="card-body">
      <span class="top"><span class="badge ${it.type}">${label}</span>${it.where ? `<span class="where">${escapeHtml(it.where)}</span>` : ''}</span>
      <span class="name">${highlight(it.name, tokens)}</span>
      <span class="desc">${escapeHtml(it.desc)}</span>
      ${incl}${why}
    </span>
    <svg class="go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </a>`;
}

const byName = (a, b) => a.it.name.localeCompare(b.it.name);

function render() {
  const { rows, counts, tokens, searching, partial } = compute();
  lastResultCount = rows.length;

  $('nAll').textContent = counts.all;
  $('nDept').textContent = counts.dept;
  $('nProg').textContent = counts.prog;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.type === state.type)));
  $('clear').hidden = !state.q;
  $('tryRow').hidden = searching;
  $('sort').disabled = searching;
  $('reset').hidden = !(state.q || state.topic || state.type !== 'all');
  $('cantBtn').hidden = !searching;

  // A to Z: group by first letter and settle on a letter that has entries
  // (a filter can empty the current one, e.g. Programs has no K). Paging by
  // letter only applies to the full list; once a topic is chosen, its few
  // entries show A to Z on one screen.
  const azView = !searching && state.sort === 'az' && rows.length > 0 && !state.topic;
  const groups = {};
  if (azView) {
    rows.sort(byName);
    for (const r of rows) { const L = /[a-z]/i.test(r.it.name[0]) ? r.it.name[0].toUpperCase() : '#'; (groups[L] ||= []).push(r); }
    if (!groups[state.letter]) state.letter = Object.keys(groups)[0];
  }

  const noun = state.type === 'dept' ? 'department' : state.type === 'prog' ? 'program or service' : 'result';
  const plural = rows.length === 1 ? noun : (noun === 'program or service' ? 'programs and services' : noun + 's');
  $('statusText').innerHTML = searching
    ? `<strong>${rows.length}</strong> ${plural} for “${escapeHtml(state.q.trim())}”${partial === 'fuzzy' ? ' (closest spelling matches)' : partial ? ' (matching some of your words)' : ''}`
    : azView
      ? `Showing <strong>${groups[state.letter].length}</strong> starting with “${state.letter}” · ${rows.length} ${plural} in all`
      : `Showing <strong>${rows.length}</strong> ${plural}`;

  if (!rows.length) {
    out.innerHTML = `<div class="empty">
      <h3>${searching ? `No matches for “${escapeHtml(state.q.trim())}”` : 'Nothing matches these filters'}</h3>
      <p>Try a shorter or more general word, or clear the filters. You can also browse the
        <a href="https://www.browardschools.com/bcps-departments" target="_top">full department list</a> or the
        <a href="https://www.browardschools.com/directory/programs-and-services-63" target="_top">programs &amp; services A to Z</a>.</p>
      ${searching ? '<p><button type="button" class="btn-primary" data-cant="1">Tell us what you were looking for</button></p>' : ''}
      <p><strong>Most visited:</strong></p>
      <div class="chips">${popularLinks()}</div>
    </div>`;
    postHeight();
    return;
  }

  let html = '';
  if (searching) {
    rows.sort((a, b) => b.s.score - a.s.score || (a.it.type === 'dept' ? -1 : 1) - (b.it.type === 'dept' ? -1 : 1) || byName(a, b));
    html = `<div class="group"><h3 class="sr-only">Best matches</h3><div class="grid">${rows.map(r => card(r, tokens)).join('')}</div></div>`;
  } else if (state.sort === 'az' && !azView) {
    rows.sort(byName);
    const short = {};
    for (const r of rows) { const L = /[a-z]/i.test(r.it.name[0]) ? r.it.name[0].toUpperCase() : '#'; (short[L] ||= []).push(r); }
    html = Object.entries(short).map(([L, g]) =>
      `<section class="group"><h3>${L} <span class="n">${g.length}</span></h3><div class="grid">${g.map(r => card(r, tokens)).join('')}</div></section>`).join('');
  } else if (state.sort === 'az') {
    const present = Object.keys(groups);
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const bar = `<nav class="az" aria-label="Choose a letter">${letters.map(L => groups[L]
      ? `<button type="button" data-letter="${L}" aria-pressed="${L === state.letter}" aria-label="${L}, ${groups[L].length} ${groups[L].length === 1 ? 'entry' : 'entries'}">${L}</button>`
      : `<span aria-hidden="true">${L}</span>`).join('')}</nav>`;
    const g = groups[state.letter];
    const i = present.indexOf(state.letter);
    const prev = present[i - 1], next = present[i + 1];
    const pager = `<div class="az-pager">
      ${prev ? `<button type="button" class="more" data-letter="${prev}">← ${prev}</button>` : '<span></span>'}
      ${next ? `<button type="button" class="more" data-letter="${next}">Next: ${next} →</button>` : '<span></span>'}
    </div>`;
    html = bar + `<section class="group" id="letter-${state.letter}" aria-live="polite"><h3>${state.letter} <span class="n">${g.length}</span></h3><div class="grid">${g.map(r => card(r, tokens)).join('')}</div></section>` + pager;
  } else {
    html = Object.keys(TOPICS).map(k => {
      const g = rows.filter(r => r.it.topic === k).sort((a, b) =>
        (rank(a.it) - rank(b.it) || 0) || (a.it.type === b.it.type ? 0 : a.it.type === 'dept' ? -1 : 1) || byName(a, b));
      if (!g.length) return '';
      const all = state.topic === k || opened.has(k) || g.length <= PREVIEW + 2;
      const shown = all ? g : g.slice(0, PREVIEW);
      const more = all ? '' : `<button type="button" class="more" data-more="${k}">Show all ${g.length} in ${escapeHtml(TOPICS[k])}</button>`;
      return `<section class="group"><h3>${escapeHtml(TOPICS[k])} <span class="n">${g.length}</span></h3><div class="grid">${shown.map(r => card(r, tokens)).join('')}</div>${more}</section>`;
    }).join('');
  }
  out.innerHTML = `<div class="results">${html}</div>`;
  postHeight();
}

// SEARCH LOG
// Searches and clicks go to /api/bcps/directory-events so the Directory editor
// can show top searches and searches that found nothing. A search is logged
// once the query has settled for 1.5 seconds (not on every keystroke), or
// right away when a result is opened. No names, accounts or IPs are stored;
// the session id is random per page load.
const EVENTS_URL = '/api/bcps/directory-events';
const canLog = /^https?:$/.test(location.protocol);
const SESSION_ID = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(36).padStart(2, '0')).join('').slice(0, 24);
const HOST = (() => {
  try { return new URLSearchParams(location.search).get('host') || (document.referrer ? new URL(document.referrer).hostname : location.hostname); }
  catch (e) { return ''; }
})();
let lastResultCount = 0, lastLogged = '', searchTimer, lastInput = 'typed';

function send(events, beacon) {
  if (!canLog) return;
  const body = JSON.stringify({ events: events.map(e => ({ ...e, session_id: SESSION_ID, host: HOST, type_filter: state.type, topic_filter: state.topic || null })) });
  try {
    if (beacon && navigator.sendBeacon && navigator.sendBeacon(EVENTS_URL, body)) return;
    fetch(EVENTS_URL, { method: 'POST', body, keepalive: true }).catch(() => {});
  } catch (e) {}
}
function pendingSearch() {
  const q = state.q.trim();
  if (!q || norm(q) === lastLogged) return null;
  lastLogged = norm(q);
  return { event: 'search', query: q, result_count: lastResultCount, input: lastInput };
}
function scheduleSearchLog() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { const e = pendingSearch(); if (e) send([e]); }, 1500);
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-id]');
  if (!a) return;
  clearTimeout(searchTimer);
  const events = [];
  const s = pendingSearch();
  if (s) events.push(s);
  const cards = [...document.querySelectorAll('a.card[data-id]')];
  events.push({
    event: 'click', entry_id: a.dataset.id,
    query: a.dataset.popular ? null : (state.q.trim() || null),
    result_rank: a.dataset.popular ? null : cards.indexOf(a) + 1,
    result_count: state.q.trim() ? lastResultCount : null,
  });
  send(events, true);
}, true);

// EVENTS
let t;
qEl.addEventListener('input', () => { lastInput = 'typed'; clearTimeout(t); t = setTimeout(() => { state.q = qEl.value; render(); scheduleSearchLog(); }, 90); });
qEl.addEventListener('keydown', e => { if (e.key === 'Escape' && qEl.value) { e.preventDefault(); setQuery(''); } });
$('clear').addEventListener('click', () => { setQuery(''); qEl.focus(); });
document.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (tab) { state.type = tab.dataset.type; render(); return; }
  const letter = e.target.closest('[data-letter]');
  if (letter) {
    state.letter = letter.dataset.letter;
    render();
    // Keep focus on the matching letter in the bar, so keyboard users stay oriented.
    const btn = document.querySelector(`.az [data-letter="${state.letter}"]`);
    if (btn) btn.focus({ preventScroll: true });
    const bar = document.querySelector('.az');
    if (bar && bar.getBoundingClientRect().top < 0) bar.scrollIntoView({ block: 'start' });
    return;
  }
  const more = e.target.closest('[data-more]');
  if (more) { opened.add(more.dataset.more); render(); return; }
});
topicSel.addEventListener('change', () => { state.topic = topicSel.value; render(); });
$('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
$('reset').addEventListener('click', () => {
  Object.assign(state, { q: '', type: 'all', aud: '', topic: '', letter: 'A' });
  qEl.value = ''; topicSel.value = ''; render();
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== qEl && !/input|select|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); qEl.focus(); }
});
function setQuery(v) { qEl.value = v; state.q = v; render(); scheduleSearchLog(); }

// The same embed can open pre-filtered on each host page, e.g.
// ?type=prog on Programs & Services, ?type=dept on Departments, ?q=bus, or
// ?sort=topic to open grouped by topic instead of A to Z, or ?letter=S to
// open the A to Z view on a letter other than A.
try {
  const p = new URLSearchParams(location.search);
  if (['all', 'dept', 'prog'].includes(p.get('type'))) state.type = p.get('type');
  if (p.get('q')) { state.q = p.get('q'); qEl.value = state.q; }
  if (AUDIENCES[p.get('aud')]) state.aud = p.get('aud');
  if (['az', 'topic'].includes(p.get('sort'))) { state.sort = p.get('sort'); $('sort').value = state.sort; }
  if (/^[A-Za-z]$/.test(p.get('letter') || '')) state.letter = p.get('letter').toUpperCase();
} catch (e) {}

// Same auto-height contract as the other BCPS embeds: post
// { type: 'bcps-widget-resize', slug, height } to the parent so the host
// iframe can size itself to the content.
function postHeight() {
  if (window.parent === window) return;
  const height = document.documentElement.scrollHeight;
  window.parent.postMessage({ type: 'bcps-widget-resize', slug: 'department-program-directory', height }, '*');
}
window.addEventListener('resize', postHeight);

// VOICE SEARCH (Vanessa, 2026-10-02)
// Uses the speech recognition built into the browser (Chrome, Edge, Safari on
// desktop, iPhone and Android), so it costs nothing to run. The button only
// appears where the browser supports it. On a host page the iframe needs
// allow="microphone", which the Widgets hub embed code includes.
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
const micBtn = $('mic'), voiceMsg = $('voiceMsg');
function setListening(on) {
  micBtn.setAttribute('aria-pressed', String(on));
  micBtn.setAttribute('aria-label', on ? 'Stop listening' : 'Search by voice');
  voiceMsg.textContent = on ? 'Listening... say what you are looking for.' : voiceMsg.textContent;
}
function startVoice() {
  try {
    recognizer = new Recognition();
    recognizer.lang = navigator.language || 'en-US';
    recognizer.interimResults = true;
    recognizer.maxAlternatives = 1;
    recognizer.onresult = e => {
      const heard = Array.from(e.results, r => r[0].transcript).join(' ').trim();
      lastInput = 'voice';
      qEl.value = heard; state.q = heard; render();
    };
    recognizer.onerror = e => {
      voiceMsg.textContent = e.error === 'not-allowed' || e.error === 'service-not-allowed'
        ? 'The microphone is blocked. Allow it in your browser settings, or type your search.'
        : e.error === 'no-speech' ? "We didn't hear anything. Tap the microphone and try again."
        : 'Voice search is not available right now. Please type your search.';
    };
    recognizer.onend = () => {
      recognizer = null;
      setListening(false);
      if (voiceMsg.textContent.startsWith('Listening')) voiceMsg.textContent = '';
      if (state.q.trim()) scheduleSearchLog();
    };
    voiceMsg.textContent = '';
    recognizer.start();
    setListening(true);
  } catch (e) {
    recognizer = null;
    setListening(false);
    voiceMsg.textContent = 'Voice search is not available right now. Please type your search.';
  }
}
if (Recognition) {
  micBtn.hidden = false;
  qEl.classList.add('has-mic');
  micBtn.addEventListener('click', () => { if (recognizer) recognizer.stop(); else startVoice(); });
}

// CAN'T FIND IT?
// Sends the person's own words to the directory team (bcps_directory_feedback
// via /api/bcps/directory-events), where the editor can add them as tags.
const cantPanel = $('cantPanel'), cantMsg = $('cantMsg'), cantDone = $('cantDone'), cantSend = $('cantSend');
function openCant() {
  cantPanel.hidden = false;
  $('cantBtn').setAttribute('aria-expanded', 'true');
  cantDone.textContent = '';
  cantSend.disabled = false;
  if (!cantMsg.value.trim()) cantMsg.value = state.q.trim();
  cantMsg.focus();
  postHeight();
}
function closeCant() {
  cantPanel.hidden = true;
  $('cantBtn').setAttribute('aria-expanded', 'false');
  postHeight();
}
$('cantBtn').addEventListener('click', () => (cantPanel.hidden ? openCant() : closeCant()));
$('cantCancel').addEventListener('click', closeCant);
cantMsg.addEventListener('input', () => { cantSend.disabled = false; });
document.addEventListener('click', e => { if (e.target.closest('[data-cant]')) openCant(); });
cantPanel.addEventListener('submit', async e => {
  e.preventDefault();
  const message = cantMsg.value.trim();
  if (!message) { cantDone.textContent = 'Type a few words about what you need, then press Send.'; return; }
  if (!canLog) { cantDone.textContent = 'Sending is turned off in this preview copy.'; return; }
  cantSend.disabled = true;
  try {
    const res = await fetch(EVENTS_URL, {
      method: 'POST',
      body: JSON.stringify({ events: [{ event: 'feedback', message, query: state.q.trim() || null, result_count: state.q.trim() ? lastResultCount : null, session_id: SESSION_ID, host: HOST }] }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    cantMsg.value = '';
    cantDone.textContent = 'Thank you. Your note was sent to the team that keeps this directory up to date.';
  } catch (err) {
    cantSend.disabled = false;
    cantDone.textContent = "Your note didn't send. Please try again in a moment.";
  }
});

async function boot() {
  out.innerHTML = '<div class="empty"><p>Loading departments, programs and services...</p></div>';
  try {
    buildItems(await loadEntries());
  } catch (e) {
    $('statusText').textContent = '';
    out.innerHTML = `<div class="empty"><h3>The directory could not load</h3>
      <p>Please try again in a moment, or browse the
      <a href="https://www.browardschools.com/bcps-departments" target="_top">full department list</a> or the
      <a href="https://www.browardschools.com/directory/programs-and-services-63" target="_top">programs &amp; services A to Z</a>.</p></div>`;
    postHeight();
    return;
  }
  $('try').innerHTML = popularLinks();
  render();
  if (state.q) scheduleSearchLog();
}
boot();
</script>
</body>
</html>
